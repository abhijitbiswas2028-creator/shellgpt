description: The ShellGPT desktop app in your browser. `shellgpt workbench` serves the desktop interface through the ShellGPT dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `shellgpt workbench` run and again after each ShellGPT update it runs `npm install --ignore-scripts` (guided by ShellGPT's lockfile) and Vite against your ShellGPT checkout's desktop sources, writing only under ~/.shellgpt/shellgpt-workbench and its own plugin dir (the checkout is only read), and starts `shellgpt dashboard` on loopback when none is running.
maintainer: sxuff
